name: 1. Tao Kinh Ban AI

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'Nhập chủ đề video của bạn:'
        required: true
        default: 'Tại sao nước Mỹ giàu lên nhanh chóng sau Thế chiến thứ 2?'

jobs:
  generate-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install google-generativeai

      - name: Run AI Script Generator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TOPIC: ${{ github.event.inputs.topic }}
        run: |
          python scripts/generate_script.py

      - name: Commit and push script.md
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-generate script for topic: ${{ github.event.inputs.topic }}"
          file_pattern: script.md
